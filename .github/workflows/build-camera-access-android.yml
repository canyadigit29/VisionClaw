name: Build CameraAccess Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove local Android Studio Java path
        working-directory: samples/CameraAccessAndroid
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Generate Secrets.kt
        working-directory: samples/CameraAccessAndroid
        run: |
          cat > app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess/Secrets.kt <<'EOF'
          package com.meta.wearable.dat.externalsampleapps.cameraaccess

          object Secrets {
              const val geminiAPIKey = "${{ secrets.GEMINI_API_KEY }}"
              const val openClawHost = "http://127.0.0.1"
              const val openClawPort = 18789
              const val openClawHookToken = "${{ secrets.OPENCLAW_HOOK_TOKEN }}"
              const val openClawGatewayToken = "${{ secrets.OPENCLAW_GATEWAY_TOKEN }}"
              const val webrtcSignalingURL = ""
          }
          EOF

      - name: Make Gradle wrapper executable
        working-directory: samples/CameraAccessAndroid
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: samples/CameraAccessAndroid
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-debug-apk
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/*.apk
